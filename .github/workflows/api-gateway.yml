name: api-gateway

# Path-filtered: runs only when the gateway, the shared libraries or the shared build settings change.
on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - 'shared/src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    paths:
      - 'services/api-gateway/**'
      - 'shared/src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/api-gateway.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and run unit tests
        run: dotnet test --project services/api-gateway/tests/ApiGateway.UnitTests/ApiGateway.UnitTests.csproj -c Release
