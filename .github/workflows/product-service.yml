name: product-service

# Path-filtered: runs only when ProductService, the shared libraries or the shared build settings change.
on:
  push:
    branches: [main]
    paths:
      - 'services/product-service/**'
      - 'shared/src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/product-service.yml'
  pull_request:
    paths:
      - 'services/product-service/**'
      - 'shared/src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/product-service.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and run unit tests
        run: dotnet test --project services/product-service/tests/ProductService.UnitTests/ProductService.UnitTests.csproj -c Release
